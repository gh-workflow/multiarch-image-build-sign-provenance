name: Release

"on":
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  change-validation:
    uses: ./.github/workflows/change-validation.yml

  verify-release-refs:
    name: Verify release references
    needs: [change-validation]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Verify README and example workflows use current tag
        run: |
          set -euo pipefail
          if grep -nP "gh-workflow/multiarch-image-publish@(?!${GITHUB_REF_NAME}\\b)" \
              README.md \
              .github/workflows/example.yml \
              .github/workflows/example-dockerhub.yml
          then
            echo "Found action refs not pinned to ${GITHUB_REF_NAME}" >&2
            exit 1
          fi


  test-e2e:
    needs: [change-validation, verify-release-refs]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/test-e2e.yml

  test-e2e-dockerhub:
    needs: [change-validation, verify-release-refs]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/test-e2e-dockerhub.yml
    secrets: inherit

  release:
    name: Publish release
    needs: [change-validation, verify-release-refs, test-e2e, test-e2e-dockerhub]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
