name: Release

"on":
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  change-validation:
    uses: ./.github/workflows/change-validation.yml

  verify-release-refs:
    name: Verify release references
    needs: [change-validation]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify README and example workflows use current tag
        run: |
          set -euo pipefail
          if grep -nP "gh-workflow/multiarch-image-publish@(?!${GITHUB_REF_NAME}\\b)" \
              README.md \
              .github/workflows/example.yml \
              .github/workflows/example-dockerhub.yml
          then
            echo "Found action refs not pinned to ${GITHUB_REF_NAME}" >&2
            exit 1
          fi


  test-e2e:
    needs: [change-validation, verify-release-refs]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read
      packages: write
      id-token: write

  test-e2e-dockerhub:
    needs: [change-validation, verify-release-refs]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/test-e2e-dockerhub.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    name: Publish release
    needs: [change-validation, verify-release-refs, test-e2e, test-e2e-dockerhub]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --generate-notes
