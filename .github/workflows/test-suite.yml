name: Test Suite

"on":
  workflow_call:
  workflow_dispatch:

jobs:
  test-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Ensure workflow actions use immutable refs
        uses: joshjohanning/ensure-immutable-actions@9f5dad6bb6148bd29ff0d874de6a8cc70af08fa9  # v2.6.2
        with:
          include-first-party: 'true'
          write-job-summary: 'on-failure-only'
          exclude-workflows: >-
            example.yml,
            example-main.yml,
            example-dockerhub.yml,
            example-dockerhub-main.yml

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run linters
        run: |
          scripts/lint.sh

      - name: Check `example-main.yml` only differs by action ref
        run: |
          sed \
            -e 's#name: Example Publish Main#name: Example Publish#' \
            -e 's#gh-workflow/multiarch-image-publish@main#gh-workflow/multiarch-image-publish@0.2.1#' \
            .github/workflows/example-main.yml > /tmp/example-main.normalized.yml
          diff -u .github/workflows/example.yml /tmp/example-main.normalized.yml

      - name: Check `example-dockerhub-main.yml` only differs by action ref
        run: |
          sed \
            -e 's#name: Example Publish Docker Hub Main#name: Example Publish Docker Hub#' \
            -e 's#gh-workflow/multiarch-image-publish@main#gh-workflow/multiarch-image-publish@0.2.1#' \
            .github/workflows/example-dockerhub-main.yml > /tmp/example-dockerhub-main.normalized.yml
          diff -u .github/workflows/example-dockerhub.yml /tmp/example-dockerhub-main.normalized.yml

      - name: Run tests
        run: |
          pytest --cov=src --cov-report=term-missing
